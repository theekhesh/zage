[package]
name = "zage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"], default-features = false }

[package.metadata.generate-rpm]
summary = "Lightweight terminal download manager"
license = "Unspecified"
assets = [{ source = "target/release/zage", dest = "/usr/bin/zage", mode = "755" }]

[profile.release]
lto = true
codegen-units = 1
strip = true
